    <body>
        <div class="container">
            <div class="card template">
                <div class="backside">
                    <div class="background"></div>
                    <div class="spell-school"></div>
                    <div class="border-outer">
                        <div class="border-inner"></div>
                    </div>
                </div>
                <div class="frontside">
                    <div class="border-outer">
                        <div class="border-inner">
                            <div class="image">
                                <img src="" alt="">
                            </div>
                            <div class="spell-slot"><span>?</span></div>
                            <div class="spell-type">
                                <img src="" alt="">
                            </div>
                            <div class="spell-contents">
                                <div class="spell-name">Title</div>
                                <div class="spell-description">
                                    Description
                                </div>
                                <div class="spell-attributes">
                                    <span class="spell-range">60 ft</span>
                                    <span class="spell-duration">1 minute</span>
                                </div>
                                <div class="spell-stats">
                                    <div class="left">
                                        <span class="spell-action"></span>
                                    </div>
                                    <div class="right">
                                        <span class="ritual" title="Ritual"></span>
                                        <span class="concentration" title="Concentration"></span>
                                        <span class="verbal" title="Verbal"></span>
                                        <span class="somatic" title="Somatic"></span>
                                        <span class="material" title="Material"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
