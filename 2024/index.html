<!doctype html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2024 Spellbook</title>
    <link rel="shortcut icon" href="../img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pangolin&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <script type="text/javascript" src="./js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="./js/drawdown.js"></script>
    <script type="text/javascript" src="./js/main.js" defer></script>
    </head>
    <body>
        <header class="spellbook-header">
            <div>
                <!--<p class="eyebrow">Dungeons &amp; Dragons 2024</p>-->
                <h1>2024 Spellbook</h1>
            </div>
            <button class="add-spell-button" type="button">+ Add spells</button>
        </header>
        <main class="spellbook" aria-live="polite">
            <div class="empty-spellbook">
                <span class="empty-mark">✦</span>
                <h2>Your spellbook is empty</h2>
                <p>Gather the spells you have prepared for this adventure.</p>
            </div>
        </main>
        <div class="modal" aria-hidden="true">
            <div class="modal-panel spell-picker-panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
                <div class="modal-heading">
                    <div>
                        <!--<p class="eyebrow">The archive</p>-->
                        <h2 id="picker-title">Choose spells</h2>
                    </div>
                    <button class="close-modal" type="button" aria-label="Close spell picker">&times;</button>
                </div>
                <div class="filters">
                    <label class="spell-search">
                        <span>Search spells</span>
                        <input type="search" placeholder="Search by spell name" autocomplete="off">
                    </label>
                    <fieldset>
                        <legend>Classes</legend>
                        <div class="class-filters"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Spell level</legend>
                        <div class="level-filters"></div>
                    </fieldset>
                </div>
                <p class="result-count"></p>
                <div class="spell-list"></div>
            </div>
            <div class="inspection" role="dialog" aria-modal="true" aria-labelledby="inspection-title">
                <h2 id="inspection-title" class="sr-only">Spell inspection</h2>
                <div class="inspection-card"></div>
                <div class="inspection-actions">
                    <button class="confirm-spell" type="button">Add it to spellbook</button>
                    <button class="cancel-inspection" type="button">Cancel</button>
                </div>
            </div>
        </div>
        <div class="card-template">
            <div class="card template">
                <div class="backside">
                    <div class="background"></div>
                    <div class="spell-school"></div>
                    <div class="source"></div>
                    <div class="classes"></div>
                    <div class="border-outer">
                        <div class="border-inner"></div>
                    </div>
                </div>
                <div class="frontside">
                    <div class="border-outer">
                        <div class="border-inner">
                            <div class="image">
                                <img src="" alt="">
                            </div>
                            <div class="spell-slot"><span>?</span></div>
                            <div class="spell-type">
                                <img src="" alt="">
                            </div>
                            <div class="spell-contents">
                                <div class="spell-name">Title</div>
                                <div class="spell-description"></div>
                                <div class="spell-attributes">
                                    <span class="spell-range">60 ft</span>
                                    <span class="spell-duration">1 minute</span>
                                </div>
                                <div class="spell-stats">
                                    <div class="left">
                                        <span class="spell-action"></span>
                                    </div>
                                    <div class="right">
                                        <span class="ritual" title="Ritual"></span>
                                        <span class="concentration" title="Concentration"></span>
                                        <span class="verbal" title="Verbal"></span>
                                        <span class="somatic" title="Somatic"></span>
                                        <span class="material" title="Material"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
